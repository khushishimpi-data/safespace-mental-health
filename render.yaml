# ============================================================
# Render Blueprint – SafeSpace Mental Health Platform
# https://render.com/docs/blueprint-spec
# ============================================================

databases:
  - name: safespace-db
    plan: free            # switch to "starter" for production
    databaseName: safespace
    user: safespace

services:
  # -------------------- FastAPI Backend --------------------
  - type: web
    name: safespace-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safespace-db
          property: connectionURI
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        sync: false          # set manually in Render dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: VOICE_PROVIDER
        value: local
      - key: PYTHON_VERSION
        value: "3.11.9"

  # -------------------- Streamlit Frontend --------------------
  - type: web
    name: safespace-frontend
    runtime: python
    plan: free
    rootDir: frontend
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: safespace-backend
          property: hostport       # gives https://<name>.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.9"
